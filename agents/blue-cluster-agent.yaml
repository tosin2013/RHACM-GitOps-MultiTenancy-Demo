# NOTE: This file is a reference template. In production, the agent ArgoCD CR
# is generated dynamically by scripts/setup-agent-tls.sh which discovers the
# Principal route at runtime. The principalServerAddress below is a placeholder.
---
apiVersion: v1
kind: Namespace
metadata:
  name: argocd-agent-blue-cluster
---
apiVersion: argoproj.io/v1beta1
kind: ArgoCD
metadata:
  name: agent-argocd
  namespace: argocd-agent-blue-cluster
spec:
  server:
    enabled: false
  argoCDAgent:
    agent:
      enabled: true
      client:
        principalServerAddress: "<DISCOVERED_AT_RUNTIME_BY_setup-agent-tls.sh>"
        principalServerPort: "443"
      tls:
        rootCASecretName: argocd-agent-ca
        secretName: argocd-agent-client-tls

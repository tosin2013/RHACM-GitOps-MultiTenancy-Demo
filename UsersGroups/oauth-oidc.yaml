apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: htpasswd_provider
    mappingMethod: claim
    type: HTPasswd
    htpasswd:
      fileData:
        name: htpass-secret
  - name: rhbk
    mappingMethod: claim
    type: OpenID
    openID:
      clientID: idp-4-ocp
      clientSecret:
        name: rhbk-oidc-client-secret
      issuer: REPLACE_WITH_KEYCLOAK_URL/realms/sso
      claims:
        preferredUsername:
          - preferred_username
        name:
          - name
        email:
          - email
        groups:
          - groups

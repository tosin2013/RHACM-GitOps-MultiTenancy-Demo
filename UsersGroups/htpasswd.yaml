# htpasswd OAuth configuration (fallback when Keycloak is not available)
# For Keycloak-based setup, use scripts/setup-users.sh which auto-detects
# and configures the OIDC provider instead.
apiVersion: config.openshift.io/v1
kind: OAuth
metadata:
  name: cluster
spec:
  identityProviders:
  - name: htpasswd_provider 
    mappingMethod: claim 
    type: HTPasswd
    htpasswd:
      fileData:
        name: htpass-secret

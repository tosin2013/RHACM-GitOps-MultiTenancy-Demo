apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fleet-platform-appset
  namespace: fleet-gitops
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: fleet-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: platform-baseline-{{name}}
    spec:
      project: default
      source:
        repoURL: https://github.com/tosin2013/RHACM-GitOps-MultiTenancy-Demo.git
        targetRevision: fleetdev
        path: PlatformConfig/baseline
      destination:
        namespace: platform-config
        name: "{{name}}"
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
        automated:
          # prune: false intentionally — platform resources (LimitRanges, NetworkPolicies)
          # should not be deleted automatically if removed from Git during an incident.
          prune: false
          selfHeal: true
